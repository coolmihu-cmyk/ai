<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>历史 · MIHU DESIGN OS</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="css/base.css?v=20260727-32">
<link rel="stylesheet" href="css/pages.css?v=20260727-32">
<link rel="stylesheet" href="css/modern-ui.css?v=20260728-04">
</head>
<body class="assets-page">

<nav class="app-rail" aria-label="主要功能">
  <a class="rail-brand" href="index.html" title="Pic.supmihu.cn"><img src="logo.png" alt=""></a>
  <div class="rail-nav">
    <a class="rail-item" href="index.html" title="图片">
      <img class="rail-icon" src="icon/chuangzuo.svg" alt="" aria-hidden="true">
      <span>图片</span>
    </a>
    <a class="rail-item" href="video.html" title="视频">
      <img class="rail-icon" src="icon/video.svg" alt="" aria-hidden="true">
      <span>视频</span>
    </a>
    <a class="rail-item active" href="assets.html" aria-current="page" title="历史">
      <img class="rail-icon" src="icon/photo.svg" alt="" aria-hidden="true">
      <span>历史</span>
    </a>
    <a class="rail-item" href="edit.html" title="编辑">
      <img class="rail-icon" src="icon/edit.svg" alt="" aria-hidden="true">
      <span>编辑</span>
    </a>
    <a class="rail-item" href="settings.html" title="设置">
      <img class="rail-icon" src="icon/shezhi.svg" alt="" aria-hidden="true">
      <span>设置</span>
    </a>
  </div>
</nav>

<main class="assets-shell">
  <header class="assets-header">
    <div>
      <span class="assets-kicker">GENERATION HISTORY</span>
      <h1>历史</h1>
    </div>
    <div class="assets-count" id="assetsCount">0 项记录</div>
  </header>
  <p class="assets-retention-note">图片和视频只保存72小时，请及时下载。</p>
  <section class="assets-generation" id="assetsGeneration" aria-live="polite" hidden>
    <div class="assets-generation-visual" id="assetsGenerationVisual" hidden>
      <img id="assetsGenerationReference" alt="生成任务参考图">
    </div>
    <div class="assets-generation-content">
      <div class="assets-generation-head">
        <span class="assets-generation-model" id="assetsGenerationModel">Image 2</span>
        <time id="assetsGenerationElapsed">00:00</time>
      </div>
      <p id="assetsGenerationPrompt">正在准备生成任务</p>
      <div class="assets-generation-status">
        <span id="assetsGenerationStatus">正在提交</span>
        <strong id="assetsGenerationPercent">0%</strong>
      </div>
      <div class="assets-generation-track" aria-hidden="true">
        <div id="assetsGenerationBar"></div>
      </div>
      <div class="assets-generation-error" id="assetsGenerationError" hidden></div>
    </div>
  </section>
  <div class="assets-loading" id="assetsLoading">
    <span></span>
    <b>正在加载历史</b>
  </div>
  <div class="assets-empty" id="assetsEmpty" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 15 3-3 2.5 2.5L16 10l3 4"/></svg>
    <b>还没有生成记录</b>
    <span>生成的图片和视频会自动出现在这里。</span>
    <a href="index.html">开始生图</a>
  </div>
  <div class="assets-groups" id="assetsGrid" aria-live="polite"></div>
</main>

<div class="toast" id="toast"></div>
<script src="shared.js?v=20260728-04"></script>
<script src="assets-page.js?v=20260728-04"></script>
</body>
</html>
