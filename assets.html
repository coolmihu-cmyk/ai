<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>历史 · MIHU DESIGN LAB</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="css/base.css?v=20260828-141842">
<link rel="stylesheet" href="css/pages.css?v=20260908-105154">
<link rel="stylesheet" href="css/modern-ui.css?v=20260911-319">

<body class="assets-page">

<header class="inner-prototype-header"><div class="inner-prototype-tab"><b>我的资产</b><span>PIC.SUPMIHU.CN BETA <strong id="appVersion">V397.0</strong></span></div><nav><a href="index.html"><img src="icon/home-gemini-solid.png" alt="">返回首页</a><a href="settings.html"><img src="icon/key-solid.png" alt="">输入密钥</a></nav></header>

<nav class="app-rail" aria-label="主要功能" data-app-rail data-current="assets"></nav>

<main class="assets-shell">
  <header class="assets-header page-note">
    <img src="icon/info.svg" alt="" aria-hidden="true">
    <p>查看、整理并继续编辑你的每一次图片创作。</p>
  </header>
  <div class="assets-ledger">
  <div class="assets-ledger-head"><span>YOUR ARCHIVE</span><div class="assets-ledger-meta"><label class="assets-date-filter" for="assetsDateFilter"><select id="assetsDateFilter" aria-label="按月份筛选历史图片"><option value="all">全部时间</option></select></label><div class="assets-count" id="assetsCount">0 张图片</div></div></div>
  <section class="assets-generation" id="assetsGeneration" aria-live="polite" hidden>
    <header class="assets-generation-list-head">
      <span>TASK LIST</span>
      <h2>任务列表</h2>
    </header>
    <div class="assets-generation-task-row">
      <div class="assets-generation-visual" id="assetsGenerationVisual" hidden>
        <img id="assetsGenerationReference" alt="生成任务参考图">
      </div>
      <div class="assets-generation-content">
        <div class="assets-generation-head">
          <span class="assets-generation-model" id="assetsGenerationModel">GPT</span>
          <time id="assetsGenerationElapsed">00:00</time>
        </div>
        <p id="assetsGenerationPrompt">正在准备生成任务</p>
        <div class="assets-generation-status">
          <span id="assetsGenerationStatus">正在提交</span>
          <strong id="assetsGenerationPercent">0%</strong>
        </div>
        <div class="assets-generation-track" aria-hidden="true">
          <div id="assetsGenerationBar"></div>
        </div>
        <div class="assets-generation-error" id="assetsGenerationError" hidden></div>
      </div>
    </div>
  </section>
  <section class="asset-task-center" id="assetsTaskCenter" aria-labelledby="assetsTaskTitle" hidden>
    <div class="asset-task-center-head"><div><span>QUEUE</span><h2 id="assetsTaskTitle">等待中的任务</h2></div><b id="assetsTaskCount">0</b></div>
    <div class="asset-task-list" id="assetsTaskList" aria-live="polite"></div>
  </section>  <div class="assets-loading" id="assetsLoading">
    <span></span>
    <b>正在加载历史</b>
  </div>
  <div class="assets-empty" id="assetsEmpty" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 15 3-3 2.5 2.5L16 10l3 4"/></svg>
    <b>还没有生成记录</b>
    <span>生成的图片会自动出现在这里。</span>
    <a href="index.html">开始生图</a>
  </div>
  <div class="assets-groups" id="assetsGrid" aria-live="polite"></div>
  </div>
</main>

<div class="local-edit-layer" id="localEditLayer" hidden>
  <section class="local-edit-dialog" role="dialog" aria-modal="true" aria-labelledby="localEditTitle">
    <header class="local-edit-head">
      <div><span>IMAGE EDIT</span><h2 id="localEditTitle">图片编辑</h2></div>
      <button type="button" class="local-edit-close" id="localEditClose" aria-label="关闭图片编辑">×</button>
    </header>
    <div class="local-edit-layout">
      <div class="local-edit-workspace">
        <div class="local-edit-stage" id="localEditStage">
          <img id="localEditImage" alt="待编辑的原图">
          <button type="button" class="local-edit-version-switch is-previous" id="localEditPreviousVersion" aria-label="查看上一版本" title="上一版本" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg></button>
          <button type="button" class="local-edit-version-switch is-next" id="localEditNextVersion" aria-label="查看下一版本" title="下一版本" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5 7 7-7 7"/></svg></button>
          <button type="button" class="local-edit-reset" id="localEditReset" aria-label="恢复默认大小和位置" title="恢复默认大小和位置">↺</button>
          <p class="local-edit-preview-meta" id="localEditPreviewMeta" aria-live="polite" hidden></p>
          <button type="button" class="local-edit-original-preview" id="localEditOriginalPreview" aria-label="查看原图" title="查看原图" hidden>查看原图</button>
          <div class="local-edit-loading" id="localEditLoading">正在载入原图</div>
        </div>
      </div>
      <div class="local-edit-panel">
        <div class="local-edit-conversation">
          <div class="local-edit-thread" id="localEditThread" role="log" aria-live="polite"></div>
          <p class="local-edit-status" id="localEditStatus" role="status"></p>
          <div class="local-edit-composer" id="localEditComposer">
            <button type="button" class="local-edit-conversation-toggle" id="localEditConversationToggle" aria-controls="localEditComposer" aria-expanded="true" aria-label="收起输入框" title="收起输入框"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
            <textarea id="localEditPrompt" maxlength="3000" rows="7"></textarea>
            <b class="local-edit-prompt-count" id="localEditPromptCount">0/3000</b>
            <div class="local-edit-prompt-meta"><div class="local-edit-control-row"><button type="button" class="local-edit-upload" id="localEditUpload" aria-label="添加参考图片" title="添加参考图片">+</button><input id="localEditFileInput" type="file" accept="image/png,image/jpeg,image/webp" hidden><div class="local-edit-reference-preview" id="localEditReferencePreview" hidden><img id="localEditReferencePreviewImage" alt="已添加的参考图片"><button type="button" id="localEditReferenceClear" aria-label="移除参考图片" title="移除参考图片">×</button></div><div class="local-edit-settings" aria-label="图片编辑参数"><div class="creation-select creation-dropdown local-edit-model-picker" id="localEditModelPicker"><select id="localEditModel" aria-label="编辑模型" tabindex="-1"></select><button type="button" class="creation-select-trigger local-edit-model-trigger" id="localEditModelTrigger" aria-label="选择编辑模型" aria-haspopup="listbox" aria-expanded="false"></button><div class="creation-select-menu local-edit-model-menu" id="localEditModelMenu" role="listbox" aria-label="选择编辑模型"></div></div><div class="creation-select creation-dropdown local-edit-ratio-picker" id="localEditRatioPicker"><select id="localEditRatio" aria-label="图片比例" tabindex="-1"></select><button type="button" class="creation-select-trigger local-edit-ratio-trigger" id="localEditRatioTrigger" aria-label="选择图片比例" aria-haspopup="listbox" aria-expanded="false"></button><div class="creation-select-menu local-edit-ratio-menu" id="localEditRatioMenu" role="listbox" aria-label="选择图片比例"></div></div><div class="creation-select creation-dropdown local-edit-resolution-picker" id="localEditResolutionPicker"><select id="localEditResolution" aria-label="图片分辨率" tabindex="-1"></select><button type="button" class="creation-select-trigger local-edit-resolution-trigger" id="localEditResolutionTrigger" aria-label="选择图片分辨率" aria-haspopup="listbox" aria-expanded="false"></button><div class="creation-select-menu local-edit-resolution-menu" id="localEditResolutionMenu" role="listbox" aria-label="选择图片分辨率"></div></div></div></div><div class="local-edit-submit-row"><button type="button" class="primary" id="localEditSubmit">生成</button></div></div>
          </div>
          <p class="local-edit-error" id="localEditError" hidden></p>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="reference-modal" id="assetPublishModal" hidden>
  <div class="reference-modal-card" role="dialog" aria-modal="true" aria-labelledby="assetPublishTitle">
    <div class="reference-modal-head"><div><span>PUBLISH TO PUBLIC LIBRARY</span><h2 id="assetPublishTitle">发布到公共库</h2></div><button type="button" id="assetPublishClose" aria-label="关闭">×</button></div>
    <form id="assetPublishForm">
      <label>图片地址<input id="assetPublishImageUrl" type="url" readonly></label>
      <label>生成模型<input id="assetPublishModel" type="text" readonly></label>
      <label>分类<select id="assetPublishCategory" required><option value="" selected disabled>请选择分类</option><option value="graphic-design">平面设计</option><option value="portrait-photography">摄影写真</option><option value="illustration-art">插画艺术</option><option value="architecture-space">建筑空间</option><option value="3d-modeling">3D建模</option><option value="character-storyboard">角色分镜</option><option value="ecommerce-details">电商详情</option><option value="creative-play">创意玩法</option><option value="ui-ux">UI/UX</option><option value="other">其它</option></select></label>
      <label>提示词<textarea id="assetPublishPrompt" rows="5"></textarea></label>
      <p class="reference-form-error" id="assetPublishError" hidden></p>
      <div class="reference-modal-actions"><button type="button" id="assetPublishCancel">取消</button><button type="submit" id="assetPublishSubmit">发布到公共库</button></div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="shared.js?v=20260911-347"></script>
<script src="assets-page.js?v=20260911-305"></script>
<script src="site-scrollbars.js?v=20260911-104034"></script>
</body>
</html>
