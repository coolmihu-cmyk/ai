<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>MIHU DESIGN LAB</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preload" href="fonts/montserrat-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css?v=20260923-428">
  <link rel="stylesheet" href="css/layout.css?v=20260923-428">
  <link rel="stylesheet" href="css/components.css?v=20260923-428">
  <link rel="stylesheet" href="css/pages.css?v=20260923-428">

</head>
<body class="home-page">
<header class="prototype-header"><div class="prototype-tab"><b>New folder</b><span>PIC.SUPMIHU.CN BETA <strong id="appVersion">V452.0</strong></span></div><nav><a href="assets.html"><img src="icon/folder-solid.png" alt="">资产 / 任务</a><a href="settings.html"><img src="icon/key-solid.png" alt="">输入密钥</a></nav></div></header>
<div class="home-mascot-action" aria-hidden="true">
  <img class="home-mascot-screen" src="image/tv-signal.gif?v=20260909-300" alt="" aria-hidden="true">
  <img class="home-mascot" src="image/cat.png?v=20260910-301" alt="拿着画笔的黑猫">
</div>

<nav class="app-rail" aria-label="主要功能" data-app-rail data-current="index"></nav>

<div class="app">
  <main class="main">
    <section class="home-intro" aria-labelledby="homeIntroTitle">
      <div class="home-title-block">
<h1 id="homeIntroTitle"><img class="home-brand-logo" src="image/chat-admin.png?v=20260911-1" alt="" aria-hidden="true"><span>MIHU DESIGN <strong>LAB</strong></span></h1>
        <p class="home-artist-quote" id="homeArtistQuote" aria-live="polite">
          <span id="homeArtistQuoteText"></span>
          <cite id="homeArtistQuoteAuthor"></cite>
        </p>
      </div>
    </section>

    <div class="bottom-area">
  <!-- 对话式输入卡片 -->
    <section class="composer" id="composer">
      <div class="error-msg" id="errorMsg"></div>

      <!-- 参考图行 -->
      <div class="ref-row" id="refRow"></div>

      <!-- 提示词输入 -->
      <div class="prompt-input-shell">
        <textarea class="composer-input" id="promptInput" placeholder="描述你想生成的图片…" maxlength="3000" autofocus></textarea>
        <div class="prompt-input-meta">
          <span class="char-counter prompt-char-counter"><span id="charCount">0</span>/3000</span>
        </div>
      </div>

      <!-- 底部参数栏 -->
      <div class="composer-bar">
        <button class="bar-btn ref-upload-btn" id="refBtn" title="添加参考图" aria-label="添加参考图">
          <span aria-hidden="true">+</span>
        </button>
        <div class="creation-settings" aria-label="生成设置">
          <div class="creation-select creation-model-select creation-dropdown" data-creation-dropdown="model">
            <select id="creationModelSelect" aria-label="生成模型">
              <option value="gpt">GPT IMAGE</option>
              <option value="seedream">Seedream 5.0</option>
              <option value="mosssft">MOSS SFT</option>
              <option value="nano">Nano Banana PRO</option>
            </select>
            <button class="creation-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" data-tooltip="选择模型">
              <span class="creation-select-copy"><strong data-creation-current>GPT Image2</strong></span>
              <span class="creation-select-visual" data-creation-visual><img id="creationModelIcon" src="icon/model-gpt-chatgpt.svg" alt=""></span>
              <svg class="creation-select-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4.5 6.5 3.5 3 3.5-3"/></svg>
            </button>
            <div class="creation-select-menu" role="listbox" aria-label="选择生成模型"></div>
          </div>
          <div class="creation-select creation-gpt-version-select creation-dropdown" id="creationGptVersionControl" data-creation-dropdown="gpt-version">
            <select id="creationGptVersionSelect" aria-label="GPT IMAGE 版本">
              <option value="gpt">2.0</option>
              <option value="gpt25flare" selected>2.5 Flare</option>
              <option value="gpt25sunburst">2.5 Sunburst</option>
            </select>
            <button class="creation-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" data-tooltip="选择版本"><span class="creation-select-copy"><strong data-creation-current>2.5 Flare</strong></span><span class="creation-select-visual" data-creation-visual aria-hidden="true"></span><svg class="creation-select-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4.5 6.5 3.5 3 3.5-3"/></svg></button>
            <div class="creation-select-menu" role="listbox" aria-label="选择 GPT IMAGE 版本"></div>
          </div>
          <div class="creation-select creation-ratio-select creation-dropdown" data-creation-dropdown="ratio">
            <select id="creationRatioSelect" aria-label="宽高比"></select>
            <button class="creation-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" data-tooltip="选择比例">
              <span class="creation-select-copy"><strong data-creation-current>1:1</strong></span>
              <span class="creation-select-visual" data-creation-visual aria-hidden="true"></span>
              <svg class="creation-select-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4.5 6.5 3.5 3 3.5-3"/></svg>
            </button>
            <div class="creation-select-menu creation-ratio-menu" role="listbox" aria-label="选择宽高比"></div>
          </div>
          <div class="creation-select creation-resolution-select creation-dropdown" id="creationResolutionControl" data-creation-dropdown="resolution">
            <select id="creationResolutionSelect" aria-label="分辨率"></select>
            <button class="creation-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" data-tooltip="选择分辨率">
              <span class="creation-select-copy"><strong data-creation-current>1K · 快速</strong></span>
              <span class="creation-select-visual creation-resolution-mark" data-creation-visual aria-hidden="true">1K</span>
              <svg class="creation-select-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4.5 6.5 3.5 3 3.5-3"/></svg>
            </button>
            <div class="creation-select-menu" role="listbox" aria-label="选择分辨率"></div>
          </div>
          <div class="creation-select creation-quality-select creation-dropdown" id="creationQualityControl" data-creation-dropdown="quality" hidden>
            <select id="creationQualitySelect" aria-label="图片质量"></select>
            <button class="creation-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" data-tooltip="选择图片质量"><span class="creation-select-copy"><strong data-creation-current>自动</strong></span><span class="creation-select-visual" data-creation-visual aria-hidden="true"></span><svg class="creation-select-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4.5 6.5 3.5 3 3.5-3"/></svg></button>
            <div class="creation-select-menu" role="listbox" aria-label="选择图片质量"></div>
          </div>
          <div class="creation-select creation-moderation-select creation-dropdown" id="creationModerationControl" data-creation-dropdown="moderation" hidden>
            <select id="creationModerationSelect" aria-label="内容审核强度"></select>
            <button class="creation-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="creation-select-copy"><strong data-creation-current>低强度</strong></span><span class="creation-select-visual" data-creation-visual aria-hidden="true"></span><svg class="creation-select-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4.5 6.5 3.5 3 3.5-3"/></svg></button>
            <div class="creation-select-menu" role="listbox" aria-label="选择内容审核强度"></div>
          </div>
          <div class="creation-select creation-transparent-select creation-dropdown" id="creationTransparentControl" data-creation-dropdown="transparent">
            <select id="transparentBgBtn" aria-label="透明背景">
              <option value="no" selected>否</option>
              <option value="yes">是</option>
            </select>
            <button class="creation-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" data-tooltip="是否打开透明背景">
              <span class="creation-select-copy"><strong data-creation-current>否</strong></span>
              <span class="creation-select-visual" data-creation-visual aria-hidden="true"></span>
              <svg class="creation-select-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4.5 6.5 3.5 3 3.5-3"/></svg>
            </button>
            <div class="creation-select-menu" role="listbox" aria-label="选择是否使用透明背景"></div>
          </div>
        </div>
        <button class="bar-btn clear-prompt-btn" id="clearPromptBtn" title="清空当前提示词" aria-label="清空当前提示词">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="m7 7 1 13h8l1-13"/><path d="M10 11v5M14 11v5"/></svg>
        </button>
        <div class="bar-spacer"></div>
        <div class="prompt-input-actions" aria-label="提示词选项">
          <button class="prompt-enhance-switch" id="enhanceBtn" type="button" data-tooltip="优化已输入的提示词" aria-label="优化已输入的提示词">
            <img src="icon/ai-spark-edit.svg" alt="" aria-hidden="true">
          </button>
        </div>
        <button class="one-click-style-btn" id="oneClickStyleBtn" type="button" data-tooltip="上传图片反推提示词" aria-label="上传图片反推提示词">
          <img src="icon/text.svg" alt="" aria-hidden="true">
        </button>
        <button class="send-btn" id="sendBtn" title="Ctrl + Enter 生成" aria-label="生成图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.1 6.9L21 12l-6.9 2.1L12 21l-2.1-6.9L3 12l6.9-2.1L12 3Z"/></svg></button>
      </div>

      </section>
      <section class="home-generation" id="homeGeneration" aria-label="当前生成任务与结果" hidden>
        <header><div><b>当前创作</b><span id="homeGenerationCount"></span></div><a href="assets.html">查看全部资产 / 任务</a></header>
        <div id="homeGenerationList" aria-live="polite"></div>
      </section>
    </div>
    <footer class="home-site-footer">PIC.SUPMIHU.CN</footer>
  </main>
</div>


<!-- 隐藏的文件输入 -->
<input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
<input id="oneClickStyleInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>

<div class="toast" id="toast"></div>

<button class="home-back-to-top" id="homeBackToTop" type="button" aria-label="回到顶部" title="回到顶部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 10 6-6 6 6"/><path d="M12 4v16"/></svg>
</button>

<script src="shared.js?v=452"></script>
<script src="generation-queue.js?v=450"></script>
<script src="asset-card.js?v=450"></script>
<script src="core.js?v=433"></script>
<script src="model-ui.js?v=446"></script>
<script src="generation.js?v=446"></script>
<script src="home-generation.js?v=450"></script>
<script src="app.js?v=450"></script>
<script src="site-scrollbars.js?v=20260911-104034"></script>
</body>
</html>
