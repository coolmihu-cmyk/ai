<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<title>创作 · MIHU DESIGN OS</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/modern-ui.css">
</head>
<body class="home-page">

<div class="fluid-background" aria-hidden="true">
  <span class="fluid-orb fluid-orb-a"></span>
  <span class="fluid-orb fluid-orb-b"></span>
  <span class="fluid-orb fluid-orb-c"></span>
  <span class="fluid-noise"></span>
</div>

<nav class="app-rail" aria-label="主要功能">
  <a class="rail-brand" href="index.html" title="Pic.supmihu.cn"><img src="logo.png" alt=""></a>
  <div class="rail-nav">
    <a class="rail-item active" href="index.html" aria-current="page" title="创作">
      <img class="rail-icon" src="icon/chuangzuo.svg" alt="" aria-hidden="true">
      <span>创作</span>
    </a>
    <a class="rail-item" href="assets.html" title="资产">
      <img class="rail-icon" src="icon/photo.svg" alt="" aria-hidden="true">
      <span>资产</span>
    </a>
    <a class="rail-item" href="edit.html" title="编辑">
      <img class="rail-icon" src="icon/edit.svg" alt="" aria-hidden="true">
      <span>编辑</span>
    </a>
    <a class="rail-item" href="settings.html" title="设置">
      <img class="rail-icon" src="icon/shezhi.svg" alt="" aria-hidden="true">
      <span>设置</span>
    </a>
  </div>
</nav>

<div class="app">
  <main class="main">
    <section class="home-intro" aria-labelledby="homeIntroTitle">
      <h1 id="homeIntroTitle" aria-label="把想象，交给你">
        <span id="homeTypingText" data-text="把想象，交给你">把想象，交给你</span><i class="home-typing-caret" aria-hidden="true"></i>
      </h1>
    </section>
    <div class="status generation-history-card home-generation-status" id="status" hidden>
      <div class="generation-thumb"><span class="generation-spinner"></span></div>
      <div class="generation-card-content">
        <div class="generation-card-head"><span class="dot"></span><span class="generation-model" id="generationModelName">Image 2</span><span class="status-elapsed" id="statusElapsed">00:00</span></div>
        <p class="generation-prompt" id="generationPrompt">准备生成</p>
        <div class="generation-progress-row"><span class="status-text">神经演算中</span><span class="status-percent" id="sidebarProgressPercent">0%</span></div>
        <div class="sidebar-progress-track" aria-hidden="true"><div class="sidebar-progress-bar" id="sidebarProgressBar"></div></div>
      </div>
    </div>
    <!-- 结果面板 -->
    <section class="result-panel">
      <div class="result-body">
        <div class="empty canvas-welcome" id="empty">
          <span class="canvas-welcome-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l1.35 4.15L17.5 9l-4.15 1.65L12 15l-1.35-4.35L6.5 9l4.15-1.85L12 3Z"/><path d="M18.5 14.5 19.2 17l2.3.8-2.3.8-.7 2.4-.8-2.4-2.2-.8 2.2-.8.8-2.5Z"/></svg>
          </span>
          <span class="canvas-welcome-kicker">YOUR NEXT IMAGE STARTS HERE</span>
          <b>把想象交给你</b>
          <p>在右侧输入画面描述，选择一个模型，然后开始创作。</p>
          <span class="canvas-welcome-hint">从一句提示词开始</span>
        </div>
        <div class="loading" id="loading">
          <div class="pixel-field" aria-hidden="true">
            <span class="px px1"></span><span class="px px2"></span><span class="px px3"></span>
            <span class="px px4"></span><span class="px px5"></span><span class="px px6"></span>
            <span class="px px7"></span><span class="px px8"></span><span class="px px9"></span>
            <span class="px px10"></span><span class="px px11"></span><span class="px px12"></span>
            <span class="px px13"></span><span class="px px14"></span><span class="px px15"></span>
            <span class="px px16"></span><span class="px px17"></span><span class="px px18"></span>
          </div>
          <svg class="drawing-loader" viewBox="0 0 112 82"><rect class="drawing-sheet" x="12" y="10" width="88" height="62" rx="9"/><path class="drawing-line" d="M25 54 C36 34 46 61 57 43 S77 31 88 49"/><g class="drawing-pencil"><path d="M27 51l6-3-3-3-3 6Z" fill="#61706c"/><path d="M30 45l3 3 7-7-3-3-7 7Z" fill="#dce7e3"/><path d="M37 38l3 3 30-30-3-3-30 30Z" fill="#61706c"/><path d="M64 11l3 3 5-5-3-3-5 5Z" fill="#dce7e3"/><path d="M69 6l3 3 4-4c1-1 1-2 0-3s-2-1-3 0l-4 4Z" fill="#e7aca3"/></g></svg>
          <b>正在创作图片</b>
          <div class="sub" id="loadingModelName">画面正在一点点成形</div>
          <div class="generation-progress">
            <div class="progress-track">
              <div class="progress-bar" id="progressBar"></div>
              <span class="progress-label" id="progressPercent">准备中…</span>
            </div>
          </div>
        </div>
        <div class="result-image" id="resultWrap">
          <img class="result-backdrop" id="resultBackdrop" alt="" aria-hidden="true">
          <img class="result-foreground" id="resultImage" alt="生成结果" role="button" tabindex="0" title="点击在新标签页打开">
        </div>
        <div class="image-actions" id="actions">
          <button class="icon-btn result-edit-btn" id="openResultEditor" type="button" title="在编辑页打开">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 16-.8 4.8L8 20l11-11-4-4L4 16Z"/><path d="m13.5 6.5 4 4"/></svg>
            <span>编辑</span>
          </button>
        </div>
      </div>
    </section>

  <div class="bottom-area">
  <!-- 对话式输入卡片 -->
    <section class="composer" id="composer">
      <div class="error-msg" id="errorMsg"></div>

      <!-- 参考图行 -->
      <div class="ref-row" id="refRow"></div>

      <!-- 提示词输入 -->
      <div class="prompt-input-shell">
        <textarea class="composer-input" id="promptInput" placeholder="描述你想生成的图片…" maxlength="3000"></textarea>
        <span class="char-counter prompt-char-counter"><span id="charCount">0</span>/3000</span>
        <label class="prompt-enhance-switch" for="enhanceBtn">
          <span>优化提示词</span>
          <input id="enhanceBtn" type="checkbox">
          <i aria-hidden="true"></i>
        </label>
      </div>

      <!-- 底部参数栏 -->
      <div class="composer-bar">
        <button class="bar-btn ref-upload-btn" id="refBtn" title="添加参考图" aria-label="添加参考图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <div class="creation-settings" aria-label="生成设置">
          <div class="creation-select creation-model-select creation-dropdown" data-creation-dropdown="model">
            <select id="creationModelSelect" aria-label="生成模型">
              <option value="gpt">Image 2</option>
              <option value="nano">NB2</option>
              <option value="grok">Grok</option>
            </select>
            <button class="creation-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="creation-select-copy"><strong data-creation-current>Image 2</strong></span>
              <span class="creation-select-visual" data-creation-visual><img id="creationModelIcon" src="icon/model-image2.svg" alt=""></span>
              <svg class="creation-select-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4.5 6.5 3.5 3 3.5-3"/></svg>
            </button>
            <div class="creation-select-menu" role="listbox" aria-label="选择生成模型"></div>
          </div>
          <div class="creation-select creation-ratio-select creation-dropdown" data-creation-dropdown="ratio">
            <select id="creationRatioSelect" aria-label="宽高比"></select>
            <button class="creation-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="creation-select-copy"><strong data-creation-current>1:1</strong></span>
              <span class="creation-select-visual" data-creation-visual aria-hidden="true"></span>
              <svg class="creation-select-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4.5 6.5 3.5 3 3.5-3"/></svg>
            </button>
            <div class="creation-select-menu creation-ratio-menu" role="listbox" aria-label="选择宽高比"></div>
          </div>
          <div class="creation-select creation-resolution-select creation-dropdown" id="creationResolutionControl" data-creation-dropdown="resolution">
            <select id="creationResolutionSelect" aria-label="分辨率"></select>
            <button class="creation-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="creation-select-copy"><strong data-creation-current>1K · 快速</strong></span>
              <span class="creation-select-visual creation-resolution-mark" data-creation-visual aria-hidden="true">1K</span>
              <svg class="creation-select-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4.5 6.5 3.5 3 3.5-3"/></svg>
            </button>
            <div class="creation-select-menu" role="listbox" aria-label="选择分辨率"></div>
          </div>
        </div>
        <button class="bar-btn clear-prompt-btn" id="clearPromptBtn" title="清空当前提示词" aria-label="清空当前提示词">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="m7 7 1 13h8l1-13"/><path d="M10 11v5M14 11v5"/></svg>
        </button>
        <div class="bar-spacer"></div>
        <button class="send-btn" id="sendBtn" title="Ctrl + Enter 生成" aria-label="生成图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.1 6.9L21 12l-6.9 2.1L12 21l-2.1-6.9L3 12l6.9-2.1L12 3Z"/></svg></button>
      </div>

      </section>
    </div>
  </main>
</div>

<!-- 隐藏的文件输入 -->
<input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>

<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script src="core.js"></script>
<script src="model-ui.js"></script>
<script src="home-history.js"></script>
<script src="workspace-ui.js"></script>
<script src="generation.js"></script>
<script src="app.js"></script>
</body>
</html>
