<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>设置 · MIHU DESIGN OS</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="css/base.css?v=20260828-141842">
<link rel="stylesheet" href="css/pages.css?v=20260831-125949">
<link rel="stylesheet" href="css/modern-ui.css?v=20260901-160100">
</head>
<body class="settings-page">

<nav class="app-rail" aria-label="主要功能" data-app-rail data-current="settings"></nav>

<main class="settings-shell">
  <header class="settings-header">
    <span>CONNECTION</span>
    <h1>设置</h1>
    <p>管理 APIMart 接口连接与此浏览器的本地数据。</p>
  </header>

  <div class="settings-ledger">
    <section class="settings-connection" aria-labelledby="connectionTitle">
      <div class="settings-section-head">
        <div>
          <span>APIMART CONNECTION</span>
          <h2 id="connectionTitle">接口连接</h2>
        </div>
        <div class="settings-account-balance" id="settingsAccountBalance" aria-live="polite">
          <span>账户积分余额</span>
          <strong>—</strong>
        </div>
      </div>
      <label class="settings-key-label" for="settingsApiKey">API Key</label>
      <div class="settings-key-row">
        <input id="settingsApiKey" type="password" autocomplete="off" placeholder="输入 APIMart API Key">
        <button id="settingsToggleKey" type="button">显示</button>
      </div>
      <div class="settings-key-guide" aria-labelledby="keyGuideTitle">
        <h3 id="keyGuideTitle">KEY 与历史记录</h3>
        <p><b>关联方式</b><span>相同 KEY 会连接同一份私人云端历史，在手机或其他浏览器中输入同一 KEY 即可同步。</span></p>
        <p><b>隐私范围</b><span>原始 KEY 只保存在当前浏览器，并直接用于连接 APIMart；本站服务器不会保存或收到你的原始 KEY。</span></p>
        <p><b>请自行保管</b><span>清除浏览器数据或更换设备后需要重新输入。KEY 遗失或更换后，本站无法替你找回原来关联的云端历史。</span></p>
      </div>
      <div class="settings-actions">
        <button class="settings-save" id="settingsSave" type="button">保存设置</button>
        <button class="settings-clear" id="settingsClear" type="button">清除密钥</button>
      </div>
      <a class="settings-provider-link" href="https://apimart.ai/zh" target="_blank" rel="noopener">
        打开 APIMart
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 5h11v11M19 5 6 18"/></svg>
      </a>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="shared.js?v=20260903-240000"></script>
<script src="settings-page.js?v=20260901-160500"></script>
</body>
</html>
