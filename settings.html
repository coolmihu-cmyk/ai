<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>设置与价格 · MIHU DESIGN OS</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="css/base.css?v=20260727-32">
<link rel="stylesheet" href="css/pages.css?v=20260818-01">
<link rel="stylesheet" href="css/modern-ui.css?v=20260818-134647">
</head>
<body class="settings-page">

<nav class="app-rail" aria-label="主要功能" data-app-rail data-current="settings"></nav>

<main class="settings-shell">
  <header class="settings-header">
    <span>CALIBRATION / SERVICE</span>
    <h1>设置与价格</h1>
    <p>在同一处管理接口连接，并确认每次生成的 Credits 消耗。</p>
  </header>

  <div class="settings-ledger">
    <section class="settings-connection" aria-labelledby="connectionTitle">
      <div class="settings-section-head">
        <div>
          <span>APIMART CONNECTION</span>
          <h2 id="connectionTitle">接口连接</h2>
        </div>
        <div class="connection-status" id="connectionStatus"><i></i><span>未配置</span></div>
      </div>
      <label class="settings-key-label" for="settingsApiKey">API Key</label>
      <div class="settings-key-row">
        <input id="settingsApiKey" type="password" autocomplete="off" placeholder="输入 APIMart API Key">
        <button id="settingsToggleKey" type="button">显示</button>
      </div>
      <p class="settings-key-note">密钥只保存在当前浏览器的 localStorage 中，不会写入项目文件。</p>
      <div class="settings-actions">
        <button class="settings-save" id="settingsSave" type="button">保存设置</button>
        <button class="settings-clear" id="settingsClear" type="button">清除密钥</button>
      </div>
      <a class="settings-provider-link" href="https://apimart.ai/zh" target="_blank" rel="noopener">
        前往 APIMart 充值
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 5h11v11M19 5 6 18"/></svg>
      </a>
      <a class="settings-return-link" id="settingsReturnLink" href="index.html">返回图片页</a>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="shared.js?v=20260818-134258"></script>
<script src="settings-page.js?v=20260818-131357"></script>
</body>
</html>
