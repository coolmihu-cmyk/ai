﻿<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>参考 · MIHU DESIGN OS</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="css/base.css?v=20260727-32">
<link rel="stylesheet" href="css/pages.css?v=20260818-01">
<link rel="stylesheet" href="css/modern-ui.css?v=20260818-134647">
</head>
<body class="reference-page">
<nav class="app-rail" aria-label="主要功能" data-app-rail data-current="reference"></nav>
<main class="reference-shell">
  <header class="reference-header">
    <div><span>REFERENCE LIBRARY</span><h1>参考</h1><p>收集你想保留的画面与提示词。</p></div>
    <div class="reference-header-actions">
      <div class="reference-export" aria-label="导出参考库">
        <button id="referenceExportJson" type="button">导出 JSON</button>
        <button id="referenceExportText" type="button">导出文本</button>
      </div>
      <button class="reference-create" id="referenceCreate" type="button"><span>+</span> 新建参考</button>
    </div>
  </header>
  <section class="reference-empty" id="referenceEmpty" hidden>
    <div>↗</div><b>还没有参考</b><p>把网络图片链接和提示词收藏在这里。</p><button type="button" id="referenceEmptyCreate">添加第一条参考</button>
  </section>
  <section class="reference-grid" id="referenceGrid" aria-live="polite"></section>
</main>
<div class="reference-modal" id="referenceModal" hidden>
  <div class="reference-modal-card" role="dialog" aria-modal="true" aria-labelledby="referenceModalTitle">
    <div class="reference-modal-head"><div><span>NEW REFERENCE</span><h2 id="referenceModalTitle">新建参考</h2></div><button type="button" id="referenceClose" aria-label="关闭">×</button></div>
    <form id="referenceForm">
      <label>图片链接<input id="referenceImageUrl" name="imageUrl" type="url" placeholder="https://example.com/image.jpg" required autocomplete="url"></label>
      <label>提示词<textarea id="referencePrompt" name="prompt" rows="5" placeholder="记录这张图片的提示词、画面描述或灵感…"></textarea></label>
      <p class="reference-form-error" id="referenceFormError" hidden></p>
      <div class="reference-modal-actions"><button type="button" id="referenceCancel">取消</button><button type="submit">保存参考</button></div>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="shared.js?v=20260818-134258"></script>
<script src="reference-page.js?v=20260818-133602"></script>
</body>
</html>
