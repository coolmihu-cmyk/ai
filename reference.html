<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>参考 · MIHU DESIGN OS</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="css/base.css?v=20260828-141842">
<link rel="stylesheet" href="css/pages.css?v=20260831-125949">
<link rel="stylesheet" href="css/modern-ui.css?v=20260907-154223">
</head>
<body class="reference-page">
<nav class="app-rail" aria-label="主要功能" data-app-rail data-current="reference"></nav>
<main class="reference-shell">
  <header class="reference-header page-note">
    <img src="icon/info.svg" alt="" aria-hidden="true">
    <p>收集你想保留的画面、提示词与创作灵感。</p>
  </header>
  <div class="reference-ledger">
  <div class="reference-ledger-tools">
  <div class="reference-filter" role="group" aria-label="参考分类">
    <button type="button" class="is-active" data-reference-filter="all">全部</button>
    <button type="button" data-reference-filter="photography">摄影</button>
    <button type="button" data-reference-filter="design">设计</button>
    <button type="button" data-reference-filter="commerce">电商</button>
    <button type="button" data-reference-filter="other">其它</button>
  </div>
  <div class="reference-ledger-meta">
    <label class="reference-date-filter" for="referenceDateFilter"><select id="referenceDateFilter" aria-label="按月份筛选参考"><option value="all">全部时间</option></select></label>
    <span class="reference-count" id="referenceCount">0 张图片</span>
    <button class="reference-create" id="referenceCreate" type="button"><span>+</span> 新建参考</button>
  </div>
  </div>
  <section class="reference-empty" id="referenceEmpty" hidden>
    <div>↗</div><b id="referenceEmptyTitle">还没有参考</b><p>把网络图片链接和提示词收藏在这里。</p><button type="button" id="referenceEmptyCreate">添加第一条参考</button>
  </section>
  <section class="reference-grid" id="referenceGrid" aria-live="polite"></section>
  </div>
</main>
<div class="reference-modal" id="referenceModal" hidden>
  <div class="reference-modal-card" role="dialog" aria-modal="true" aria-labelledby="referenceModalTitle">
    <div class="reference-modal-head"><div><span>NEW REFERENCE</span><h2 id="referenceModalTitle">新建参考</h2></div><button type="button" id="referenceClose" aria-label="关闭">×</button></div>
    <form id="referenceForm">
      <label>图片链接<input id="referenceImageUrl" name="imageUrl" type="url" placeholder="https://example.com/image.jpg" required autocomplete="url"></label>
      <label>分类<select id="referenceCategory" name="category"><option value="photography">摄影</option><option value="design">设计</option><option value="commerce">电商</option><option value="other">其它</option></select></label>
      <label>提示词<textarea id="referencePrompt" name="prompt" rows="5" placeholder="记录这张图片的提示词、画面描述或灵感…"></textarea></label>
      <p class="reference-form-error" id="referenceFormError" hidden></p>
      <div class="reference-modal-actions"><button type="button" id="referenceCancel">取消</button><button type="submit">保存参考</button></div>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="shared.js?v=20260907-153125"></script>
<script src="reference-page.js?v=20260907-154038"></script>
</body>
</html>
