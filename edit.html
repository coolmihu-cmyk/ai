<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<title>图片编辑 · MIHU DESIGN OS</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/canvas.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/modern-ui.css">
</head>
<body class="edit-page">

<div class="fluid-background" aria-hidden="true">
  <span class="fluid-orb fluid-orb-a"></span>
  <span class="fluid-orb fluid-orb-b"></span>
  <span class="fluid-orb fluid-orb-c"></span>
  <span class="fluid-noise"></span>
</div>

<nav class="app-rail" aria-label="主要功能">
  <a class="rail-brand" href="index.html" title="Pic.supmihu.cn"><img src="logo.png" alt=""></a>
  <div class="rail-nav">
    <a class="rail-item" href="index.html" title="创作">
      <img class="rail-icon" src="icon/chuangzuo.svg" alt="" aria-hidden="true">
      <span>创作</span>
    </a>
    <a class="rail-item" href="assets.html" title="资产">
      <img class="rail-icon" src="icon/photo.svg" alt="" aria-hidden="true">
      <span>资产</span>
    </a>
    <a class="rail-item active" href="edit.html" aria-current="page" title="编辑">
      <img class="rail-icon" src="icon/edit.svg" alt="" aria-hidden="true">
      <span>编辑</span>
    </a>
    <a class="rail-item" href="settings.html" title="设置">
      <img class="rail-icon" src="icon/shezhi.svg" alt="" aria-hidden="true">
      <span>设置</span>
    </a>
  </div>
</nav>

<main class="editor-shell">
  <section class="editor-stage" id="editorStage">
    <div class="editor-empty" id="editorEmpty"></div>
    <div class="canvas-layer" id="editorCanvasLayer" aria-label="自由图片画布"></div>
    <div class="editor-progress" id="editorProgress" hidden>
      <div class="editor-progress-row"><span id="editorProgressText">正在生成</span><span id="editorProgressValue">0%</span></div>
      <div class="editor-progress-track"><div class="editor-progress-bar" id="editorProgressBar"></div></div>
    </div>
    <div class="canvas-toolbar" aria-label="画布图片工具栏">
      <button class="canvas-tool-btn" id="editorUpload" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
        <span>上传图片</span>
      </button>
      <button class="canvas-tool-btn" id="editorEdit" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 16-.8 4.8L8 20l11-11-4-4L4 16Z"/><path d="m13.5 6.5 4 4M3.5 20.5h17"/></svg>
        <span>重新生成</span>
      </button>
      <button class="canvas-tool-btn" id="editorHD" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path d="m12 7 1.25 3.75L17 12l-3.75 1.25L12 17l-1.25-3.75L7 12l3.75-1.25L12 7Z"/></svg>
        <span>一键高清</span>
      </button>
      <button class="canvas-tool-btn canvas-delete-btn" id="editorDelete" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
        <span>删除</span>
      </button>
      <input id="editorFileInput" type="file" accept="image/*" multiple hidden>
    </div>
  </section>
</main>

<div class="modal-backdrop" id="editorEditModal">
  <div class="modal canvas-edit-modal" role="dialog" aria-modal="true" aria-labelledby="editorEditTitle">
    <div class="modal-head"><h2 id="editorEditTitle">编辑画布图片</h2><button class="close" id="editorEditClose" type="button" aria-label="关闭">×</button></div>
    <div class="field canvas-edit-model-field">
      <label>选择模型</label>
      <div class="canvas-edit-models" id="editorModels" role="radiogroup" aria-label="图生图模型">
        <button class="canvas-edit-model active" type="button" data-model="gpt" role="radio" aria-checked="true">
          <svg viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true"><path d="M482.878 128c-84.345 0-156.575 52.808-185.68 126.983-60.887 8.128-115.29 43.622-146.595 97.837-42.163 72.994-32.556 161.882 17.137 224.158-23.38 56.748-19.853 121.597 11.424 175.782 42.18 73.024 124.095 109.152 202.937 97.235C419.585 898.621 477.51 928 540.121 928c84.346 0 156.576-52.808 185.68-126.983 60.888-8.128 115.291-43.622 146.596-97.837 42.163-72.994 32.556-161.882-17.137-224.158 23.38-56.748 19.853-121.597-11.424-175.782-42.18-73.024-124.095-109.152-202.937-97.235C603.415 157.379 545.49 128 482.879 128m0 61.538c35.593 0 68.972 13.99 94.223 37.74-1.928 1.031-3.925 1.845-5.832 2.946L434.594 309.13c-14.223 8.184-23.028 23.353-23.09 39.783l-0.841 183.594-65.722-38.341V327.399c0-76 61.895-137.86 137.937-137.86m197.706 75.902c44.186 3.142 86.154 27.435 109.917 68.57 17.794 30.797 22.38 66.692 14.43 100.42-1.879-1.169-3.6-2.491-5.531-3.605l-136.734-78.907a46.232 46.232 0 0 0-46-0.06l-159.463 91.106 0.36-76.022 144.492-83.413c24.694-14.25 52.017-19.974 78.53-18.09M283.67 320.849c-0.071 2.19-0.3 4.343-0.3 6.55v157.752a46.185 46.185 0 0 0 22.91 39.904l158.68 92.488-66.021 37.68-144.552-83.353c-65.852-38-88.47-122.526-50.448-188.341 17.783-30.78 46.556-52.689 79.731-62.68m340.393 79.927l144.552 83.354c65.852 38 88.47 122.526 50.448 188.341-17.783 30.78-46.556 52.689-79.731 62.68 0.071-2.19 0.3-4.343 0.3-6.55V570.849a46.185 46.185 0 0 0-22.91-39.904l-158.68-92.488zM511.801 464.84l54.537 31.79-0.3 63.222-54.839 31.31-54.537-31.85 0.3-63.162z m100.536 58.654l65.722 38.341v166.767c0 76-61.895 137.86-137.937 137.86-35.593 0-68.972-13.988-94.223-37.74 1.928-1.03 3.925-1.844 5.832-2.945l136.675-78.906c14.223-8.184 23.028-23.353 23.09-39.783z m-46.54 89.543l-0.36 76.022-144.492 83.413c-65.852 38-150.425 15.335-188.446-50.48-17.794-30.798-22.38-66.693-14.43-100.421 1.879 1.169 3.6 2.491 5.531 3.605l136.735 78.907a46.232 46.232 0 0 0 45.999 0.06z"/></svg>Image 2
        </button>
        <button class="canvas-edit-model" type="button" data-model="nano" role="radio" aria-checked="false">
          <svg viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true"><path d="M968.923429 512.804571A486.985143 486.985143 0 0 0 512.731429 969.142857h-1.828572A486.692571 486.692571 0 0 0 54.857143 512.731429v-1.828572A486.692571 486.692571 0 0 0 511.049143 54.930286h1.901714A487.058286 487.058286 0 0 0 969.142857 511.268571v1.609143h-0.219428z"/></svg>NB2
        </button>
        <button class="canvas-edit-model" type="button" data-model="grok" role="radio" aria-checked="false">
          <svg viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true"><path d="M395.52 652.373333l340.394667-251.605333c16.682667-12.373333 40.533333-7.552 48.512 11.605333 41.813333 101.077333 23.125333 222.506667-60.16 305.877334-83.242667 83.370667-199.125333 101.632-305.024 59.989333l-115.669334 53.632c165.930667 113.536 367.402667 85.461333 493.312-40.661333 99.882667-100.010667 130.816-236.330667 101.888-359.253334l0.256 0.298667c-41.941333-180.565333 10.325333-252.757333 117.333334-400.341333 2.56-3.498667 5.12-6.997333 7.637333-10.581334l-140.842667 141.013334v-0.426667L395.392 652.458667m-70.144 61.056c-119.125333-113.92-98.56-290.176 3.029333-391.850667 75.136-75.221333 198.272-105.941333 305.749334-60.8l115.413333-53.333333a333.141333 333.141333 0 0 0-78.037333-42.666667A382.933333 382.933333 0 0 0 255.317333 248.746667c-108.074667 108.202667-142.08 274.602667-83.712 416.597333 43.605333 106.112-27.861333 181.162667-99.84 256.938667-25.557333 26.88-51.157333 53.717333-71.765333 82.133333l325.12-290.773333"/></svg>Grok
        </button>
      </div>
    </div>
    <details class="canvas-edit-settings" id="editorSettings">
      <summary>
        <span>生成设置</span>
        <span class="canvas-edit-settings-value" id="editorSettingsValue">1:1 · 1K</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m7 9 5 5 5-5"/></svg>
      </summary>
      <div class="canvas-edit-settings-body">
        <div class="canvas-edit-setting-group">
          <label>宽高比</label>
          <div class="canvas-edit-option-grid canvas-edit-ratio-grid" id="editorRatioGrid"></div>
        </div>
        <div class="canvas-edit-setting-group">
          <label>分辨率</label>
          <div class="canvas-edit-option-grid canvas-edit-resolution-grid" id="editorResolutionGrid"></div>
        </div>
      </div>
    </details>
    <div class="field canvas-edit-prompt-field">
      <div class="canvas-edit-label-row">
        <label for="editorPrompt">编辑提示词</label>
        <button class="canvas-reverse-prompt" id="editorReverse" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 0 1 13.3-6L20 8.5M20 4v4.5h-4.5"/><path d="M20 12a8 8 0 0 1-13.3 6L4 15.5M4 20v-4.5h4.5"/></svg>
          反推提示词
        </button>
      </div>
      <textarea class="canvas-edit-prompt" id="editorPrompt" maxlength="3000" placeholder="描述希望如何修改这张图片…"></textarea>
    </div>
    <p class="canvas-edit-note">当前选中的画布图片会自动作为参考图重新生成。</p>
    <div class="modal-footer">
      <button class="secondary" id="editorEditCancel" type="button">取消</button>
      <button class="primary" id="editorEditSubmit" type="button">重新生成</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script src="edit-page.js"></script>
</body>
</html>
